pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,css,json,md,yml,yaml,html}"
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: npx eslint --no-warn-ignored {staged_files}
    - name: secrets
      run: |
        if command -v gitleaks >/dev/null; then
          gitleaks git --staged --no-banner --redact
        else
          echo "gitleaks isn't installed, so CI will scan instead. Install it with: brew install gitleaks"
        fi
    - name: structure
      run: node scripts/check-structure.mjs

pre-push:
  parallel: true
  jobs:
    - name: types
      run: npm run typecheck
    - name: dependencies
      run: npm run check:deps
